name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-password
          MYSQL_DATABASE: factura_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            admin/package-lock.json
      - run: npm ci --prefix app
      - run: npm ci --prefix admin
      - run: npm audit --omit=dev --audit-level=moderate --prefix app
      - run: npm audit --omit=dev --audit-level=moderate --prefix admin
      - run: npm run lint && npm run format:check && npm run check && npm test && npm run build && npm run test:deployment
        working-directory: app
      - run: npm run lint && npm run format:check && npm run check
        working-directory: admin
      - name: MySQL migration and integration smoke
        working-directory: app
        env:
          DB_DIALECT: mysql
          DATABASE_URL: mysql://root:local-ci-password@127.0.0.1:3306/factura_test
          SUPER_ADMIN_TELEGRAM_ID: 100
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run test:mysql
      - name: Secret scan
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          # The full history includes the root commit, which has no parent for a SHA^ range.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks:/report" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --redact --log-opts="--all" \
            --report-format=sarif --report-path=/report/results.sarif
      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: ${{ runner.temp }}/gitleaks/results.sarif
          if-no-files-found: ignore
